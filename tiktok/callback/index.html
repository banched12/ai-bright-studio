<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinite.auras — TikTok sign-in</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b0b0f;color:#e9e9f0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  .card{max-width:34rem;padding:2rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 .75rem}
  p{margin:.5rem 0;color:#a9a9b8}
  code{background:#17171f;padding:.15rem .4rem;border-radius:.3rem;color:#d7d7e4}
</style>
</head>
<body>
<div class="card">
  <h1>Returning you to Aura Studio…</h1>
  <p id="msg">Handing the authorization code back to the desktop app.</p>
  <p>If nothing happens, keep the studio window open and try signing in again.</p>
</div>
<script>
  // TikTok Login Kit (Web) requires an https redirect URI. Aura Studio is a
  // desktop app: it listens on http://localhost:8721/callback. This page just
  // forwards the ?code / ?state (or ?error) straight to that local listener.
  (function () {
    var q = window.location.search || "";
    if (!q) {
      document.getElementById("msg").textContent =
        "Nothing to forward — open this page from the TikTok sign-in flow.";
      return;
    }
    window.location.replace("http://localhost:8721/callback" + q);
  })();
</script>
</body>
</html>
